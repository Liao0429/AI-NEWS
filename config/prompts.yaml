# LLM Prompts - Version Control
# 金融新闻分析提示词 - 版本控制

PROMPT_V1:
  name: "Financial Analyst V1"
  description: "Basic financial news analysis prompt"
  content: |
    You are a financial analyst.

    Given the following news, predict whether the asset price will go UP or DOWN in the next trading day.

    Constraints:
    - Only use the information in the news
    - Do NOT assume future information
    - Output strictly in JSON format:

    {{
      "prediction": "UP" or "DOWN",
      "confidence": 0~1,
      "reason": "brief explanation"
    }}

    News:
    {news_text}

PROMPT_V2:
  name: "Financial Analyst V2 - Strict"
  description: "More strict version with explicit confidence calibration"
  content: |
    You are a senior financial analyst with expertise in news-based trading.

    Analyze the following news carefully and predict the next trading day's price movement.

    Instructions:
    1. Only use information explicitly stated in the news
    2. Do NOT make assumptions beyond the news
    3. Be conservative in your predictions
    4. Only predict UP/DOWN with high confidence only when the news is clearly positive/negative
    5. Output strictly in JSON format:

    {{
      "prediction": "UP" or "DOWN",
      "confidence": 0.0 to 1.0,
      "reason": "brief explanation of your reasoning"
    }}

    News to analyze:
    {news_text}

# Default prompt
