# Experiment Configuration
random_seed: 42
num_runs: 100

# Experiment Settings
experiment_setting:
  sample_size: 150
  test_assets: ["AAPL", "BTC-USD", "GOOGL", "MSFT"]
  transaction_cost: 0.001  # 0.1% per trade

# Asset Configuration
asset: AAPL
start_date: 2023-01-01
end_date: 2024-12-31

# Strategy Configuration
noise_rate: 0.02

# Strategies
strategies:
  llm:
    model: "kimi-k2"
    pure_mode: true  # 强制关闭fallback
    prompt_version: "PROMPT_V1"
    use_cache: true
  hash:
    seed: 42
  momentum:
    time_window: 5
  mean_reversion:
    time_window: 5

# Trading Configuration
trading_cost: 0.001  # 0.1% per trade
slippage: 0.0005  # 0.05%
max_position: 1  # 每次交易最大1单位

# Data Paths
news_data_path: data/real/real_news_dataset.csv
results_path: results/tables/
logs_path: results/logs/
